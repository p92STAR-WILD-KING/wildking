<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #00b074;
            --secondary: #00e699;
            --bg-card: rgba(2, 26, 19, 0.95);
        }

        body.theme-crimson { --primary: #e11d48; --secondary: #f43f5e; --bg-card: rgba(30, 10, 15, 0.95); }
        body.theme-royal { --primary: #2563eb; --secondary: #3b82f6; --bg-card: rgba(10, 20, 40, 0.95); }
        body.theme-violet { --primary: #7c3aed; --secondary: #8b5cf6; --bg-card: rgba(25, 10, 35, 0.95); }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        #game-frame { width: 100vw; height: 100vh; border: none; }

        /* Predict Button */
        #hack-btn { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: #fff; padding: 14px 28px; border-radius: 50px; font-weight: bold; cursor: pointer; border: 2px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; text-transform: uppercase; font-size: 14px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: var(--bg-card); border: 2px solid var(--primary); border-radius: 16px; padding: 25px; width: 280px; text-align: center; color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        .login-box h3 { color: var(--secondary); margin: 0 0 10px 0; font-size: 16px; }
        .login-box input { width: 100%; padding: 10px; margin: 12px 0; background: rgba(0,0,0,0.5); border: 1px solid var(--primary); color: var(--secondary); border-radius: 8px; text-align: center; outline: none; font-weight: bold; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        /* Panel */
        #hack-panel { position: fixed; top: 12px; left: 12px; width: 260px; background: var(--bg-card); border: 2px solid var(--primary); border-radius: 12px; padding: 12px; color: #fff; display: none; z-index: 999; backdrop-filter: blur(8px); }
        .panel-title { font-size: 11px; font-weight: bold; color: var(--secondary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; text-transform: uppercase; }
        .pred-text { font-size: 20px; font-weight: bold; color: var(--secondary); text-align: center; margin: 10px 0; letter-spacing: 1px; }
        .wa-btn { display: block; text-align: center; background: #25D366; color: #fff; text-decoration: none; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body class="theme-emerald">

    <div id="hack-btn" onclick="showAuth()">🎯 PREDICT</div>

    <div id="auth-modal" class="modal-overlay">
        <div class="login-box">
            <h3 id="ui-auth-title">92STAR WILD KING</h3>
            <p style="font-size: 10px; color: #cbd5e1; margin: 0;">ENTER VIP ACCESS KEY</p>
            <input type="password" id="user-pass-input" placeholder="Enter Password...">
            <button onclick="validatePassword()">VERIFY ACCESS</button>
            <button onclick="closeAuth()" style="background:#333; margin-top:8px;">CANCEL</button>
        </div>
    </div>

    <div id="hack-panel">
        <div class="panel-title">👑 <span id="ui-panel-title">92STAR WILD KING</span> | ACTIVE</div>
        <div style="font-size:10px; color:#cbd5e1; margin-top:8px;">PERIOD SIGNAL: <b id="ui-period" style="color:#fff;">#101</b></div>
        <div class="pred-text" id="ui-pred-display">ANALYZING...</div>
        <a id="ui-wa-link" href="#" target="_blank" class="wa-btn" style="display:none;">📲 Join Official WhatsApp</a>
    </div>

    <iframe id="game-frame" src="about:blank"></iframe>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA88rkLL26wYKXwtKqh8iU4LI",
            authDomain: "wild-king-vip.firebaseapp.com",
            projectId: "wild-king-vip",
            storageBucket: "wild-king-vip.firebasestorage.app",
            messagingSenderId: "95207356123",
            appId: "1:95207356123:web:eea5e7184582e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activePassword = "96A4MSW";
        let defaultGameUrl = "https://www.92star5.com/#/register?invitationCode=21536827529";
        let predSpeed = 30000;
        let predTimer = null;

        document.getElementById('game-frame').src = defaultGameUrl;

        db.collection("config").doc("siteSettings").onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                if(data.accessPassword) activePassword = data.accessPassword;
                if(data.gameUrl && document.getElementById('game-frame').src !== data.gameUrl) {
                    document.getElementById('game-frame').src = data.gameUrl;
                }
                if(data.headerTitle) {
                    document.getElementById('ui-auth-title').textContent = data.headerTitle;
                    document.getElementById('ui-panel-title').textContent = data.headerTitle;
                }
                if(data.theme) {
                    document.body.className = "theme-" + data.theme;
                }
                if(data.waChannel) {
                    const waBtn = document.getElementById('ui-wa-link');
                    waBtn.href = data.waChannel;
                    waBtn.style.display = "block";
                }
                if(data.speed) {
                    predSpeed = parseInt(data.speed) * 1000;
                }
            }
        });

        function showAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }

        function validatePassword() {
            const entered = document.getElementById('user-pass-input').value.trim();
            if(entered === activePassword) {
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('hack-panel').style.display = 'block';
                document.getElementById('hack-btn').style.display = 'none';
                startPrediction();
            } else {
                alert("❌ Incorrect Access Key!");
            }
        }

        function startPrediction() {
            if(predTimer) clearInterval(predTimer);
            const options = ['BIG', 'SMALL', 'RED', 'GREEN'];
            let periodCount = 100;
            
            const run = () => {
                periodCount++;
                const pick = options[Math.floor(Math.random() * options.length)];
                const display = document.getElementById('ui-pred-display');
                if(display) {
                    display.textContent = pick;
                    display.style.color = (pick === 'RED') ? '#ef4444' : (pick === 'GREEN' ? '#10b981' : '#00e699');
                }
                document.getElementById('ui-period').textContent = "#" + periodCount;
            };
            
            run();
            predTimer = setInterval(run, predSpeed);
        }
    </script>
</body>
</html>
