<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>92Star Official - VIP Prediction</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #f6465d;
            --secondary-color: #0ecb81;
            --bg-dark: #181b2a;
            --panel-bg: #1e2329;
            --border-color: #2b313a;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0e11; }
        #game-frame { width: 100vw; height: 100vh; border: none; }

        /* Official 92Star Style Floating Button */
        #hack-btn { 
            position: fixed; bottom: 80px; right: 20px; 
            background: linear-gradient(135deg, #f6465d, #e03146); 
            color: #fff; width: 60px; height: 60px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 700; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); 
            box-shadow: 0 4px 15px rgba(246, 70, 93, 0.4); z-index: 1000; 
            font-size: 12px; text-transform: uppercase; text-align: center;
        }

        /* Password Modal (Matches 92Star Theme) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
        .login-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; width: 300px; text-align: center; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .login-box h3 { color: #fcd535; margin: 0 0 8px 0; font-size: 18px; }
        .login-box p { color: #848e9c; font-size: 12px; margin-bottom: 16px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; background: #0b0e11; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; text-align: center; outline: none; font-size: 14px; box-sizing: border-box; }
        .login-box input:focus { border-color: #fcd535; }
        .login-box button { width: 100%; padding: 12px; background: #fcd535; border: none; color: #0b0e11; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; transition: opacity 0.2s; }
        .login-box button:active { opacity: 0.8; }

        /* Professional 92Star Styled Panel */
        #hack-panel { 
            position: fixed; top: 12px; left: 12px; width: 305px; 
            background: var(--panel-bg); border: 1px solid var(--border-color); 
            border-radius: 12px; padding: 14px; color: #fff; display: none; 
            z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px; }
        .panel-title { font-size: 14px; font-weight: 700; color: #fcd535; display: flex; align-items: center; gap: 6px; }
        .close-btn { background: rgba(246, 70, 93, 0.15); color: var(--primary-color); border: none; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }

        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #848e9c; margin-bottom: 8px; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 6px; }
        .info-row span b { color: #fff; }

        /* Main Prediction Display Box */
        .prediction-card { background: #181b2a; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 12px; }
        .prediction-label { font-size: 10px; color: #848e9c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600; }
        .prediction-value { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin: 4px 0; }
        .prediction-value.big { color: var(--secondary-color); text-shadow: 0 0 15px rgba(14, 203, 129, 0.3); }
        .prediction-value.small { color: #2196f3; text-shadow: 0 0 15px rgba(33, 150, 243, 0.3); }

        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }

        /* History Table Section */
        .section-title { font-size: 11px; font-weight: 700; color: #848e9c; margin-bottom: 6px; text-transform: uppercase; }
        .history-list { max-height: 140px; overflow-y: auto; background: #0b0e11; border-radius: 8px; border: 1px solid var(--border-color); padding: 4px; }
        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .history-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 6px 8px; margin-bottom: 3px; background: rgba(255,255,255,0.02); border-radius: 4px; border-left: 3px solid #2196f3; }
        .history-item.big { border-left-color: var(--secondary-color); }
        .history-item.small { border-left-color: #2196f3; }

        /* Official Links Style */
        .links-container { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .link-btn { display: block; text-align: center; color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 700; transition: opacity 0.2s; }
        .link-btn.channel { background: #0ecb81; color: #0b0e11; }
        .link-btn.support { background: #2b313a; color: #fcd535; border: 1px solid #fcd535; }
    </style>
</head>
<body>

    <!-- Floating Trigger Button -->
    <div id="hack-btn" onclick="checkAuthAndToggle()">VIP</div>

    <!-- Password Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="login-box">
            <h3 id="ui-auth-title">92STAR VIP</h3>
            <p>Enter Security Password to Access Panel</p>
            <input type="password" id="user-pass-input" placeholder="••••••••">
            <button onclick="validatePassword()">CONFIRM</button>
        </div>
    </div>

    <!-- Clean Professional Panel -->
    <div id="hack-panel">
        <div class="panel-header">
            <div class="panel-title">🛡️ <span id="ui-panel-title">92STAR VIP PREDICTOR</span></div>
            <button class="close-btn" onclick="toggleHackPanel()">CLOSE</button>
        </div>
        
        <div class="info-row">
            <span>Period: <b id="ui-period">--</b></span>
            <span>Timer: <b id="ui-timer" style="color: #fcd535;">30s</b></span>
        </div>
        
        <div class="prediction-card">
            <div class="prediction-label">AI Trend Analysis</div>
            <div class="prediction-value" id="ui-pred-display">--</div>
            <div id="status-msg" class="status-badge" style="display:none;"></div>
        </div>

        <div class="section-title">📊 Game History Records</div>
        <div class="history-list" id="history-list"></div>

        <div class="links-container">
            <a id="ui-wa-channel" href="#" target="_blank" class="link-btn channel" style="display:none;">📢 Official WhatsApp Channel</a>
            <a id="ui-wa-contact" href="#" target="_blank" class="link-btn support" style="display:none;">💬 Customer Support</a>
        </div>
    </div>

    <iframe id="game-frame" src="about:blank"></iframe>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA88rkLL26wYKXwtKqh8iU4LI",
            authDomain: "wild-king-vip.firebaseapp.com",
            projectId: "wild-king-vip",
            storageBucket: "wild-king-vip.firebasestorage.app",
            messagingSenderId: "95207356123",
            appId: "1:95207356123:web:eea5e7184582e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activePassword = "96A4MSW";
        let defaultGameUrl = "https://www.92star5.com/#/register?invitationCode=21536827529";
        let gameInterval = null;
        let isPanelOpen = false;
        let isAuthenticated = false;
        
        let realGameHistory = [];
        let lastActivePeriod = "";
        let currentPrediction = "BIG";

        document.getElementById('game-frame').src = defaultGameUrl;

        // Fetch settings from Firebase
        db.collection("config").doc("siteSettings").onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                if(data.accessPassword) activePassword = data.accessPassword;
                if(data.gameUrl && document.getElementById('game-frame').src !== data.gameUrl) {
                    document.getElementById('game-frame').src = data.gameUrl;
                }
                if(data.headerTitle) {
                    document.getElementById('ui-auth-title').textContent = data.headerTitle;
                    document.getElementById('ui-panel-title').textContent = data.headerTitle;
                }
                
                const waChan = document.getElementById('ui-wa-channel');
                if(data.waChannel && data.waChannel.trim() !== "") {
                    waChan.href = data.waChannel;
                    waChan.style.display = "block";
                } else { waChan.style.display = "none"; }

                const waCont = document.getElementById('ui-wa-contact');
                if(data.waNumber && data.waNumber.trim() !== "") {
                    waCont.href = `https://wa.me/${data.waNumber}`;
                    waCont.style.display = "block";
                } else { waCont.style.display = "none"; }
            }
        });

        function checkAuthAndToggle() {
            if (!isAuthenticated) {
                document.getElementById('auth-modal').style.display = 'flex';
            } else {
                toggleHackPanel();
            }
        }

        function toggleHackPanel() {
            const panel = document.getElementById('hack-panel');
            if(!isPanelOpen) {
                panel.style.display = 'block';
                isPanelOpen = true;
                startEngine();
            } else {
                panel.style.display = 'none';
                isPanelOpen = false;
            }
        }

        function validatePassword() {
            const entered = document.getElementById('user-pass-input').value.trim();
            if(entered === activePassword) {
                isAuthenticated = true;
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('hack-panel').style.display = 'block';
                isPanelOpen = true;
                startEngine();
            } else {
                alert("Incorrect Password!");
            }
        }

        function startEngine() {
            if(gameInterval) clearInterval(gameInterval);

            function updateCycle() {
                const now = new Date();
                const totalSeconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                const currentSecondInMin = now.getSeconds();
                
                const timeLeft = 30 - (currentSecondInMin % 30);
                document.getElementById('ui-timer').textContent = timeLeft + "s";

                const yyyy = now.getUTCFullYear();
                const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(now.getUTCDate()).padStart(2, '0');
                const totalPeriodsToday = Math.floor(totalSeconds / 30);
                const periodNumber = `${yyyy}${mm}${dd}1000${10001 + totalPeriodsToday}`;

                document.getElementById('ui-period').textContent = "#" + periodNumber.slice(-6);

                const seedNum = parseInt(periodNumber.slice(-3));
                currentPrediction = (seedNum % 2 === 0 && seedNum % 3 !== 0) ? 'BIG' : 'SMALL';

                const display = document.getElementById('ui-pred-display');
                display.textContent = currentPrediction;
                display.className = "prediction-value " + currentPrediction.toLowerCase();

                if (lastActivePeriod !== periodNumber) {
                    if (lastActivePeriod !== "") {
                        const actualResultNum = (seedNum * 3) % 10;
                        const actualResultType = actualResultNum >= 5 ? 'BIG' : 'SMALL';

                        const statusMsgEl = document.getElementById('status-msg');
                        statusMsgEl.style.display = "inline-block";
                        
                        if (currentPrediction === actualResultType) {
                            statusMsgEl.textContent = "WIN";
                            statusMsgEl.style.color = "#0ecb81";
                            statusMsgEl.style.background = "rgba(14,203,129,0.15)";
                        } else {
                            statusMsgEl.textContent = "LOSS";
                            statusMsgEl.style.color = "#f6465d";
                            statusMsgEl.style.background = "rgba(246,70,93,0.15)";
                        }

                        realGameHistory.unshift({
                            period: lastActivePeriod.slice(-5),
                            number: actualResultNum,
                            type: actualResultType
                        });

                        if (realGameHistory.length > 10) realGameHistory.pop();
                    }
                    lastActivePeriod = periodNumber;
                    renderHistory();
                }
            }

            function renderHistory() {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                
                realGameHistory.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `history-item ${item.type.toLowerCase()}`;
                    row.innerHTML = `
                        <span style="color:#848e9c;">#${item.period}</span>
                        <span style="color:#fff; font-weight:600;">Num: ${item.number}</span>
                        <b style="color:${item.type === 'BIG' ? '#0ecb81' : '#2196f3'};">${item.type}</b>
                    `;
                    list.appendChild(row);
                });
            }

            updateCycle();
            gameInterval = setInterval(updateCycle, 1000);
        }
    </script>
</body>
                </html>
