<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>92STAR - WILD KING VIP</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        #game-frame { width: 100vw; height: 100vh; border: none; }

        /* Floating Predict / Close Button */
        #hack-btn { position: fixed; bottom: 25px; right: 25px; background: linear-gradient(135deg, #00b074, #00e699); color: #000; padding: 15px 30px; border-radius: 50px; font-weight: 900; cursor: pointer; border: 2px solid #fff; box-shadow: 0 6px 20px rgba(0,230,153,0.5); z-index: 1000; text-transform: uppercase; font-size: 15px; letter-spacing: 1px; }

        /* Password Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #111a2e; border: 2px solid #00e699; border-radius: 16px; padding: 25px; width: 280px; text-align: center; color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        .login-box h3 { color: #00e699; margin: 0 0 10px 0; font-size: 16px; }
        .login-box input { width: 100%; padding: 10px; margin: 12px 0; background: rgba(0,0,0,0.5); border: 1px solid #00e699; color: #00e699; border-radius: 8px; text-align: center; outline: none; font-weight: bold; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: linear-gradient(90deg, #00b074, #00e699); border: none; color: #000; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        /* Cyber Hack & JS Auto-Bet Panel */
        #hack-panel { position: fixed; top: 15px; left: 15px; width: 310px; background: rgba(11, 19, 36, 0.97); border: 2px solid #00e699; border-radius: 16px; padding: 12px; color: #fff; display: none; z-index: 999; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.7); }
        .panel-title { font-size: 12px; font-weight: bold; color: #00e699; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 6px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; }
        
        .pred-box { background: rgba(0, 230, 153, 0.1); border: 1px dashed #00e699; border-radius: 8px; padding: 8px; margin: 8px 0; text-align: center; }
        .pred-text { font-size: 24px; font-weight: 900; color: #fbbf24; margin-top: 2px; letter-spacing: 2px; }
        .timer-box { font-size: 11px; text-align: center; color: #fbbf24; font-weight: bold; margin-bottom: 4px; }
        .status-msg { font-size: 10px; text-align: center; font-weight: bold; margin-top: 4px; padding: 4px; border-radius: 4px; }

        /* Auto-Bet Section */
        .autobet-section { background: rgba(0, 0, 0, 0.4); border: 1px solid #3b82f6; border-radius: 8px; padding: 8px; margin-top: 8px; }
        .autobet-title { font-size: 11px; font-weight: bold; color: #3b82f6; margin-bottom: 6px; text-transform: uppercase; text-align: center; }
        .autobet-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 5px; }
        .autobet-row input { width: 90px; padding: 4px; background: #0b1324; border: 1px solid #3b82f6; color: #fff; border-radius: 4px; text-align: center; font-weight: bold; }
        .autobet-btn { width: 100%; padding: 8px; margin-top: 6px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .start-btn { background: #22c55e; color: #fff; }
        .stop-btn { background: #ef4444; color: #fff; display: none; }

        .contact-btn { display: block; text-align: center; color: #fff; text-decoration: none; padding: 6px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-top: 6px; }
        .wa-channel { background: #25D366; }
        .wa-chat { background: #128C7E; }
        .tg-chat { background: #0088cc; }
    </style>
</head>
<body>

    <!-- Floating Toggle Button -->
    <div id="hack-btn" onclick="checkAuthAndToggle()">🎯 PREDICT</div>

    <!-- Password Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="login-box">
            <h3 id="ui-auth-title">VIP ACCESS</h3>
            <p style="font-size: 10px; color: #cbd5e1; margin: 0;">ENTER PASSWORD</p>
            <input type="password" id="user-pass-input" placeholder="Password...">
            <button onclick="validatePassword()">VERIFY ACCESS</button>
            <button onclick="closeAuth()" style="background:#333; color:#fff; margin-top:8px;">CANCEL</button>
        </div>
    </div>

    <!-- Active Hack & JS Auto-Bet Panel -->
    <div id="hack-panel">
        <div class="panel-title">
            <span>👑 <span id="ui-panel-title">WILD KING</span></span>
            <span style="cursor:pointer; color:#ef4444; background: rgba(239,68,68,0.1); padding: 2px 6px; border-radius: 4px;" onclick="toggleHackPanel()">❌ CLOSE</span>
        </div>
        
        <div style="font-size:11px; color:#cbd5e1; margin-top:6px;">PERIOD: <b id="ui-period" style="color:#fff;">--</b></div>
        <div class="timer-box">⏳ Next Result in: <span id="ui-timer">30</span>s</div>
        
        <div class="pred-box">
            <div style="font-size: 9px; color: #94a3b8; font-weight: bold;">AI RECOMMENDATION</div>
            <div class="pred-text" id="ui-pred-display">WAITING...</div>
            <div id="status-msg" class="status-msg" style="display:none;"></div>
        </div>

        <!-- JS AUTO-BET ENGINE (2X MARTINGALE SYSTEM) -->
        <div class="autobet-section">
            <div class="autobet-title">🤖 JS AUTO-BET SCRIPT (2X)</div>
            <div class="autobet-row">
                <span>Base Amount (PKR):</span>
                <input type="number" id="base-amount" value="10" min="1">
            </div>
            <div class="autobet-row">
                <span>Next Bet Amount:</span>
                <b id="current-bet-display" style="color:#fbbf24;">10</b>
            </div>
            <div class="autobet-row">
                <span>Execution Status:</span>
                <b id="autobet-status-text" style="color:#94a3b8;">IDLE</b>
            </div>
            <button id="start-autobet-btn" class="autobet-btn start-btn" onclick="startAutoBet()">START JS AUTO-BET</button>
            <button id="stop-autobet-btn" class="autobet-btn stop-btn" onclick="stopAutoBet()">STOP JS AUTO-BET</button>
        </div>

        <a id="ui-wa-channel" href="#" target="_blank" class="contact-btn wa-channel" style="display:none;">📲 Official WhatsApp Channel</a>
        <a id="ui-wa-contact" href="#" target="_blank" class="contact-btn wa-chat" style="display:none;">💬 Contact on WhatsApp</a>
        <a id="ui-tg-contact" href="#" target="_blank" class="contact-btn tg-chat" style="display:none;">✈️ Contact on Telegram</a>
    </div>

    <iframe id="game-frame" src="about:blank"></iframe>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA88rkLL26wYKXwtKqh8iU4LI",
            authDomain: "wild-king-vip.firebaseapp.com",
            projectId: "wild-king-vip",
            storageBucket: "wild-king-vip.firebasestorage.app",
            messagingSenderId: "95207356123",
            appId: "1:95207356123:web:eea5e7184582e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activePassword = "96A4MSW";
        let defaultGameUrl = "https://www.92star5.com/#/register?invitationCode=21536827529";
        let gameInterval = null;
        let isPanelOpen = false;
        let isAuthenticated = false;
        
        let isAutoBetRunning = false;
        let baseBetAmount = 10;
        let currentBetAmount = 10;
        let hasPlacedBetThisRound = false;

        let lastActivePeriod = "";
        let currentPrediction = "BIG";

        document.getElementById('game-frame').src = defaultGameUrl;

        db.collection("config").doc("siteSettings").onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                if(data.accessPassword) activePassword = data.accessPassword;
                if(data.gameUrl && document.getElementById('game-frame').src !== data.gameUrl) {
                    document.getElementById('game-frame').src = data.gameUrl;
                }
                if(data.headerTitle) {
                    document.getElementById('ui-auth-title').textContent = data.headerTitle;
                    document.getElementById('ui-panel-title').textContent = data.headerTitle;
                }
                
                const waChan = document.getElementById('ui-wa-channel');
                if(data.waChannel && data.waChannel.trim() !== "") {
                    waChan.href = data.waChannel;
                    waChan.style.display = "block";
                } else { waChan.style.display = "none"; }

                const waCont = document.getElementById('ui-wa-contact');
                if(data.waNumber && data.waNumber.trim() !== "") {
                    waCont.href = `https://wa.me/${data.waNumber}`;
                    waCont.style.display = "block";
                } else { waCont.style.display = "none"; }

                const tgCont = document.getElementById('ui-tg-contact');
                if(data.telegram && data.telegram.trim() !== "") {
                    tgCont.href = `https://t.me/${data.telegram}`;
                    tgCont.style.display = "block";
                } else { tgCont.style.display = "none"; }
            }
        });

        function checkAuthAndToggle() {
            if (!isAuthenticated) {
                document.getElementById('auth-modal').style.display = 'flex';
            } else {
                toggleHackPanel();
            }
        }

        function closeAuth() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        function toggleHackPanel() {
            const panel = document.getElementById('hack-panel');
            const btn = document.getElementById('hack-btn');
            if(!isPanelOpen) {
                panel.style.display = 'block';
                btn.textContent = '❌ CLOSE';
                isPanelOpen = true;
                startWinGoEngine();
            } else {
                panel.style.display = 'none';
                btn.textContent = '🎯 PREDICT';
                isPanelOpen = false;
            }
        }

        function validatePassword() {
            const entered = document.getElementById('user-pass-input').value.trim();
            if(entered === activePassword) {
                isAuthenticated = true;
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('hack-btn').textContent = '❌ CLOSE';
                document.getElementById('hack-panel').style.display = 'block';
                isPanelOpen = true;
                startWinGoEngine();
            } else {
                alert("❌ Incorrect Password!");
            }
        }

        function startAutoBet() {
            baseBetAmount = parseInt(document.getElementById('base-amount').value) || 10;
            currentBetAmount = baseBetAmount;
            hasPlacedBetThisRound = false;
            isAutoBetRunning = true;
            
            document.getElementById('current-bet-display').textContent = currentBetAmount;
            document.getElementById('autobet-status-text').textContent = "JS SCRIPT ACTIVE (2X)";
            document.getElementById('autobet-status-text').style.color = "#22c55e";
            document.getElementById('start-autobet-btn').style.display = "none";
            document.getElementById('stop-autobet-btn').style.display = "block";
            document.getElementById('base-amount').disabled = true;
        }

        function stopAutoBet() {
            isAutoBetRunning = false;
            document.getElementById('autobet-status-text').textContent = "STOPPED";
            document.getElementById('autobet-status-text').style.color = "#ef4444";
            document.getElementById('start-autobet-btn').style.display = "block";
            document.getElementById('stop-autobet-btn').style.display = "none";
            document.getElementById('base-amount').disabled = false;
        }

        // JavaScript Automated Execution Engine
        function startWinGoEngine() {
            if(gameInterval) clearInterval(gameInterval);

            function updateCycle() {
                const now = new Date();
                const totalSeconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                const currentSecondInMin = now.getSeconds();
                
                const timeLeft = 30 - (currentSecondInMin % 30);
                document.getElementById('ui-timer').textContent = timeLeft < 10 ? "0" + timeLeft : timeLeft;

                const yyyy = now.getUTCFullYear();
                const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(now.getUTCDate()).padStart(2, '0');
                const totalPeriodsToday = Math.floor(totalSeconds / 30);
                const periodNumber = `${yyyy}${mm}${dd}1000${10001 + totalPeriodsToday}`;

                document.getElementById('ui-period').textContent = "#" + periodNumber;

                const seedNum = parseInt(periodNumber.slice(-3));
                currentPrediction = (seedNum % 2 === 0 && seedNum % 3 !== 0) ? 'BIG' : 'SMALL';

                const display = document.getElementById('ui-pred-display');
                display.textContent = currentPrediction;
                display.style.color = (currentPrediction === 'BIG') ? '#00e699' : '#3b82f6';

                // JS Auto-Bet execution check during active countdown (e.g., between 25s and 5s left)
                if (isAutoBetRunning && timeLeft <= 25 && timeLeft >= 5 && !hasPlacedBetThisRound) {
                    hasPlacedBetThisRound = true;
                    // JavaScript automated betting hook simulation targeting game frame context
                    try {
                        const iframeDoc = document.getElementById('game-frame').contentDocument || document.getElementById('game-frame').contentWindow.document;
                        // Automated script logic triggers here based on user settings
                        console.log(`[JS Auto-Bet Script]: Placing ${currentBetAmount} PKR on ${currentPrediction}`);
                    } catch(e) {
                        console.log("[JS Auto-Bet]: Cross-origin frame protection active, running background calculation engine.");
                    }
                }

                if (lastActivePeriod !== periodNumber) {
                    hasPlacedBetThisRound = false; // Reset for new period
                    if (lastActivePeriod !== "") {
                        const actualResultNum = (seedNum * 3) % 10;
                        const actualResultType = actualResultNum >= 5 ? 'BIG' : 'SMALL';

                        const statusMsgEl = document.getElementById('status-msg');
                        statusMsgEl.style.display = "block";
                        
                        if (currentPrediction === actualResultType) {
                            statusMsgEl.textContent = "🎉 Congratulations! Win";
                            statusMsgEl.style.color = "#00e699";
                            statusMsgEl.style.background = "rgba(0,230,153,0.15)";
                            
                            if (isAutoBetRunning) {
                                currentBetAmount = baseBetAmount; // Reset to base on win
                            }
                        } else {
                            statusMsgEl.textContent = "❌ Bad luck, next time!";
                            statusMsgEl.style.color = "#ef4444";
                            statusMsgEl.style.background = "rgba(239,68,68,0.15)";
                            
                            if (isAutoBetRunning) {
                                currentBetAmount = currentBetAmount * 2; // 2x Martingale multiplier on loss
                            }
                        }

                        document.getElementById('current-bet-display').textContent = currentBetAmount;
                    }
                    lastActivePeriod = periodNumber;
                }
            }

            updateCycle();
            gameInterval = setInterval(updateCycle, 1000);
        }
    </script>
</body>
</html>
