<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel - 92STAR WILD KING</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background: #080d1a; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        .card { background: #111a2e; border: 2px solid #00e699; border-radius: 12px; padding: 20px; max-width: 500px; margin: 0 auto 20px auto; }
        h2 { color: #00e699; font-size: 18px; margin-top: 0; text-align: center; text-transform: uppercase; }
        label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-top: 12px; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; border: 1px solid #1e293b; background: #0b1324; color: #00e699; font-weight: bold; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; border: none; background: linear-gradient(90deg, #00b074, #00e699); color: #000; font-weight: bold; cursor: pointer; font-size: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👑 MASTER CONTROL PANEL</h2>
        
        <label>Portal / Header Title:</label>
        <input type="text" id="title-input" placeholder="92STAR WILD KING">

        <label>VIP Access Password:</label>
        <input type="text" id="pass-input" placeholder="96A4MSW">

        <label>Game Iframe Link (Referral Link):</label>
        <input type="text" id="game-url-input" placeholder="https://www.92star5.com/#/register?...">

        <label>WhatsApp Channel Link:</label>
        <input type="text" id="wa-link-input" placeholder="https://whatsapp.com/channel/...">

        <label>User Panel Theme Style:</label>
        <select id="theme-select">
            <option value="emerald">Emerald Green (Default)</option>
            <option value="crimson">Crimson Red</option>
            <option value="royal">Royal Blue</option>
            <option value="violet">Deep Violet</option>
        </select>

        <label>Prediction Speed / Mode:</label>
        <select id="mode-select">
            <option value="30">Auto Fast (Every 30 Sec)</option>
            <option value="60">Auto Normal (Every 60 Sec)</option>
            <option value="15">Auto Turbo (Every 15 Sec)</option>
        </select>

        <button onclick="saveAdminSettings()">UPDATE LIVE SYSTEM</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA88rkLL26wYKXwtKqh8iU4LI",
            authDomain: "wild-king-vip.firebaseapp.com",
            projectId: "wild-king-vip",
            storageBucket: "wild-king-vip.firebasestorage.app",
            messagingSenderId: "95207356123",
            appId: "1:95207356123:web:eea5e7184582e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("config").doc("siteSettings").onSnapshot(doc => {
            if(doc.exists) {
                const d = doc.data();
                if(d.headerTitle) document.getElementById('title-input').value = d.headerTitle;
                if(d.accessPassword) document.getElementById('pass-input').value = d.accessPassword;
                if(d.gameUrl) document.getElementById('game-url-input').value = d.gameUrl;
                if(d.waChannel) document.getElementById('wa-link-input').value = d.waChannel;
                if(d.theme) document.getElementById('theme-select').value = d.theme;
                if(d.speed) document.getElementById('mode-select').value = d.speed;
            }
        });

        function saveAdminSettings() {
            db.collection("config").doc("siteSettings").set({
                headerTitle: document.getElementById('title-input').value.trim(),
                accessPassword: document.getElementById('pass-input').value.trim(),
                gameUrl: document.getElementById('game-url-input').value.trim(),
                waChannel: document.getElementById('wa-link-input').value.trim(),
                theme: document.getElementById('theme-select').value,
                speed: document.getElementById('mode-select').value
            }, { merge: true }).then(() => {
                alert("✅ Web Settings Successfully Updated Live!");
            }).catch(err => alert("Error: " + err.message));
        }
    </script>
</body>
</html>
